name: h2s_echo
description: H2S-ECHO wearable wristband cartridge operator app for H₂S exposure verification, shifts, and optical readout.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
